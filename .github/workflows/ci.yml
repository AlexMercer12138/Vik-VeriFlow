name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

jobs:
  hdl-runtime-feasibility:
    name: HDL runtime feasibility (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "24.14.1"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies
        run: npm ci

      - name: Test parser worker source
        run: npm test --workspace @veriflow/parser-worker

      - name: Build parser SEA probe
        run: npm run build:parser

      - name: Smoke real parser SEA probe
        run: node scripts/smoke-parser-probe.mjs

  vscode:
    name: VS Code extension compile
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "24.14.1"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies
        run: npm ci

      - name: Build generated extension assets
        run: npm run build

      - name: Test build and resource helpers
        run: npm run test:maintenance

      - name: Install browser for pin binding webview tests
        run: npx playwright install --with-deps chromium

      - name: Test extension core
        run: npm test --workspace veriflow-vscode

  node-install-smoke:
    name: Node CLI clean install (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "24.14.1"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies
        run: npm ci

      - name: Smoke clean npm artifacts
        run: npm run test:release

      - name: Smoke extracted VSIX builtin simulation
        run: npm run test:vsix --workspace veriflow-vscode

  vscode-runtime-baseline:
    name: VS Code builtin simulator (Node 18.15 runtime)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up build Node
        uses: actions/setup-node@v5
        with:
          node-version: "24.14.1"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies
        run: npm ci

      - name: Build packaged extension runtime
        run: npm run vscode:prepublish --workspace veriflow-vscode

      - name: Set up oldest extension-host Node
        uses: actions/setup-node@v5
        with:
          node-version: "18.15.0"

      - name: Smoke builtin simulation on extension-host baseline
        env:
          VERIFLOW_BUILTIN_ASSETS_ROOT: ${{ github.workspace }}/veriflow-vscode/dist/vendor/iverilog-wasm
        run: node veriflow-vscode/out/test/builtinSimulatorAssets.test.js

  node-release:
    name: Node CLI and release artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "24.14.1"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies
        run: npm ci

      - name: Test Icarus source provenance helper
        run: node --test scripts/lib/iverilog-source.test.mjs

      - name: Validate installed Icarus source provenance
        run: node scripts/lib/iverilog-source.mjs validate --package-root node_modules/@veriflow/iverilog-wasm --expected-version 0.1.4

      - name: Install Electron system dependencies
        run: sudo npx playwright install-deps chromium

      - name: Typecheck shared packages
        run: npm run typecheck:shared

      - name: Test shared packages
        run: npm run test:shared

      - name: Test Node CLI
        run: npm test --workspace @veriflow/cli

      - name: Test Electron waveform host
        run: xvfb-run -a npm test --workspace @veriflow/waveform-desktop

      - name: Test shared AD and ST frontend
        run: |
          npm run build:web
          npm test --workspace @veriflow/schematic-webview
          xvfb-run -a npm run test:browser --workspace @veriflow/schematic-webview

      - name: Smoke clean npm artifacts
        run: npm run test:release

      - name: Pack Node release artifacts
        run: npm run pack:node

      - name: Pack VS Code extension
        run: npm run package --workspace veriflow-vscode

      - name: Upload Node and VSIX artifacts
        uses: actions/upload-artifact@v4
        with:
          name: veriflow-node-release
          if-no-files-found: error
          path: |
            dist/npm/*.tgz
            veriflow-vscode/*.vsix

  simulation-regression-shard:
    name: Verilog-2005 regression shard
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "24.14.1"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies
        run: npm ci

      - name: Build simulation packages
        run: npm run build:shared

      - name: Install native Icarus
        run: sudo apt-get update && sudo apt-get install -y iverilog

      - name: Fetch pinned Icarus corpus
        shell: bash
        run: |
          revision="$(node -p "require('./tools/simulation/iverilog-revision.json').revision")"
          corpus_repository="$(node -p "require('./tools/simulation/iverilog-revision.json').repository")"
          git init "$RUNNER_TEMP/iverilog"
          git -C "$RUNNER_TEMP/iverilog" remote add origin "$corpus_repository"
          git -C "$RUNNER_TEMP/iverilog" fetch --depth=1 origin "$revision"

      - name: Run deterministic regression shard
        run: npm run test:sim-regression -- --iverilog-root "$RUNNER_TEMP/iverilog" --backend native-iverilog,builtin --shard 0/20 --json "$RUNNER_TEMP/veriflow-regress-results.json" --baseline tools/simulation/iverilog-regression-baseline.json

      - name: Upload regression results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: veriflow-regression-shard
          if-no-files-found: error
          path: ${{ runner.temp }}/veriflow-regress-results.json

  simulation-regression-full:
    name: Verilog-2005 full regression
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "24.14.1"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies
        run: npm ci

      - name: Build simulation packages
        run: npm run build:shared

      - name: Install native Icarus
        run: sudo apt-get update && sudo apt-get install -y iverilog

      - name: Fetch pinned Icarus corpus
        shell: bash
        run: |
          revision="$(node -p "require('./tools/simulation/iverilog-revision.json').revision")"
          corpus_repository="$(node -p "require('./tools/simulation/iverilog-revision.json').repository")"
          git init "$RUNNER_TEMP/iverilog"
          git -C "$RUNNER_TEMP/iverilog" remote add origin "$corpus_repository"
          git -C "$RUNNER_TEMP/iverilog" fetch --depth=1 origin "$revision"

      - name: Run complete pinned regression
        run: npm run test:sim-regression -- --iverilog-root "$RUNNER_TEMP/iverilog" --backend native-iverilog,builtin --shard 0/1 --json "$RUNNER_TEMP/veriflow-regress-results.json" --baseline tools/simulation/iverilog-regression-baseline.json

      - name: Upload regression results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: veriflow-regression-full
          if-no-files-found: error
          path: ${{ runner.temp }}/veriflow-regress-results.json
