<div class="app vf-app">
    <div class="toolbar vf-toolbar">
        <div class="file-title" id="fileTitle">No waveform loaded</div>
        <div class="tool-group vf-tool-group" aria-label="Waveform navigation">
            <button class="icon-button vf-icon-btn" id="goStart" title="Go to start (Home)" aria-label="Go to start" aria-keyshortcuts="Home"><span data-icon="skip-back"></span>
            </button>
            <button class="icon-button vf-icon-btn" id="goEnd" title="Go to end (End)" aria-label="Go to end" aria-keyshortcuts="End"><span data-icon="skip-forward"></span>
            </button>
            <button class="icon-button vf-icon-btn" id="prevPage" title="Previous page (Page Up)" aria-label="Previous page" aria-keyshortcuts="PageUp"><span data-icon="chevrons-left"></span>
            </button>
            <button class="icon-button vf-icon-btn" id="nextPage" title="Next page (Page Down)" aria-label="Next page" aria-keyshortcuts="PageDown"><span data-icon="chevrons-right"></span>
            </button>
            <button class="icon-button vf-icon-btn" id="prevChange" title="Previous change (Left)" aria-label="Previous change" aria-keyshortcuts="ArrowLeft"><span data-icon="arrow-left"></span>
            </button>
            <button class="icon-button vf-icon-btn" id="nextChange" title="Next change (Right)" aria-label="Next change" aria-keyshortcuts="ArrowRight"><span data-icon="arrow-right"></span>
            </button>
            <button class="icon-button vf-icon-btn" id="zoomOut" title="Zoom out (O or -)" aria-label="Zoom out" aria-keyshortcuts="O -"><span data-icon="zoom-out"></span>
            </button>
            <button class="icon-button vf-icon-btn" id="zoomIn" title="Zoom in (I or +)" aria-label="Zoom in" aria-keyshortcuts="I +"><span data-icon="zoom-in"></span>
            </button>
            <button class="icon-button vf-icon-btn" id="fit" title="Fit to full range (F or Space)" aria-label="Fit to full range" aria-keyshortcuts="F Space"><span data-icon="maximize"></span>
            </button>
        </div>
        <div class="tool-group cursor-controls vf-tool-group" aria-label="Waveform cursors">
            <button class="cursor-toggle vf-btn" id="cursorA" title="Activate cursor A (A)" aria-label="Activate cursor A" aria-pressed="true" aria-keyshortcuts="A">A</button>
            <button class="cursor-toggle vf-btn" id="cursorB" title="Activate cursor B (B)" aria-label="Activate cursor B" aria-pressed="false" aria-keyshortcuts="B">B</button>
        </div>
        <div class="change-search" aria-label="Waveform condition search">
            <select id="changeSearchMode" class="vf-select" title="Change search condition" aria-label="Change search condition">
                <option value="change">Any change</option>
                <option value="rising">Rising edge</option>
                <option value="falling">Falling edge</option>
                <option value="value">Exact value</option>
                <option value="xz">Any X/Z</option>
            </select>
            <input id="changeSearchValue" class="vf-input vf-input--mono" type="text" placeholder="value" aria-label="Exact waveform value" disabled />
        </div>
        <button id="goToTime" class="vf-btn vf-btn--primary">Go to</button>
        <input id="timeInput" class="vf-input vf-input--mono" type="text" placeholder="time" aria-label="Time" />
    </div>
    <div class="main">
        <aside class="sidebar vf-pane">
            <div class="search">
                <input id="searchInput" class="vf-input" type="text" placeholder="Search signals" aria-label="Search signals" />
                <select id="scopeSelect" class="vf-select" aria-label="Signal scope"></select>
            </div>
            <div class="signal-list vf-list" id="signalList"></div>
        </aside>
        <div class="resize-handle main-resize" id="mainResize" title="Resize signal library"></div>
        <main class="wave-wrap" id="waveWrap">
            <div class="wave-name-header">Time:</div>
            <div class="wave-name-list" id="waveNameList"></div>
            <div class="resize-handle wave-name-resize" id="waveNameResize" title="Resize waveform signal names"></div>
            <div class="wave-canvas-pane" id="waveCanvasPane">
                <canvas id="waveCanvas"></canvas>
                <div class="selection-box" id="selectionBox"></div>
                <div class="empty" id="emptyState">Open a VCD file to preview waveforms.</div>
            </div>
            <div class="index-overlay" id="indexOverlay" hidden aria-live="polite">
                <div class="index-overlay-content">
                    <div class="index-overlay-text" id="indexOverlayText">Preparing waveform</div>
                    <div class="index-progress indeterminate" id="indexProgress">
                        <span id="indexProgressText">Starting index</span>
                        <div class="index-progress-track" role="progressbar" aria-label="Waveform indexing progress" aria-valuemin="0" aria-valuemax="100"><div class="index-progress-fill" id="indexProgressFill"></div></div>
                        <div class="index-progress-actions"><button class="status-icon-button" id="cancelIndex" title="Cancel waveform indexing" aria-label="Cancel waveform indexing">&#x2715;</button><button class="status-command" id="retryIndex" hidden>Retry</button></div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <div class="status vf-statusbar">
        <div class="status-primary">
            <div id="statusText">Ready</div>
        </div>
        <div id="cursorMeasureText">A: - | B: - | Delta: - | Frequency: -</div>
        <div id="rangeText">Range: -</div>
    </div>
    <div class="context-menu" id="contextMenu"></div>
</div>
